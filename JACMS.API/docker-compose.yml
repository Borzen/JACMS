services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
        - 5432:5432
    environment:
        POSTGRES_PASSWORD: LocalDevP@ssword
        POSTGRES_USER: JACMSUser
        POSTGRES_DB: JACMS
    volumes:
      - ./pg-sql-init:/docker-entrypoint-initdb.d
  jacms.api:
    image: ${DOCKER_REGISTRY-}jacmsapi
    build:
      context: .
      dockerfile: JACMS.API/Dockerfile
